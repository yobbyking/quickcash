<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <!-- Outer halo background -->
    <radialGradient id="bgRad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#0d2235"/>
      <stop offset="60%" stop-color="#08131f"/>
      <stop offset="100%" stop-color="#040a13"/>
    </radialGradient>
    <!-- Main bolt gradient (emerald → cyan) -->
    <linearGradient id="boltGrad" x1="0.3" y1="0.1" x2="0.7" y2="0.9">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Inner bolt highlight -->
    <linearGradient id="boltHi" x1="0.4" y1="0.1" x2="0.5" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Coin gradient (cyan → emerald) -->
    <linearGradient id="coinGrad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <!-- Coin inner shadow -->
    <radialGradient id="coinInner" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for bolt -->
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rounded square -->
  <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#bgRad)"/>

  <!-- Inner subtle grid (very faint) -->
  <g opacity="0.05" stroke="#34d399" stroke-width="0.5">
    <line x1="20" y1="0" x2="20" y2="140"/>
    <line x1="50" y1="0" x2="50" y2="140"/>
    <line x1="80" y1="0" x2="80" y2="140"/>
    <line x1="110" y1="0" x2="110" y2="140"/>
    <line x1="0" y1="20" x2="140" y2="20"/>
    <line x1="0" y1="50" x2="140" y2="50"/>
    <line x1="0" y1="80" x2="140" y2="80"/>
    <line x1="0" y1="110" x2="140" y2="110"/>
  </g>

  <!-- Top-left highlight rim -->
  <path d="M 34 4 L 106 4 A 30 30 0 0 1 136 34 L 136 50 A 0 0 0 0 1 136 50 L 4 50 L 4 34 A 30 30 0 0 1 34 4 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Outer ring (subtle, with gradient) -->
  <circle cx="70" cy="70" r="52" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.25" fill="none"/>

  <!-- Inner orbit ring (dashed look via small circles) -->
  <g opacity="0.4">
    <circle cx="70" cy="18" r="1.5" fill="#34d399"/>
    <circle cx="122" cy="70" r="1.5" fill="#22d3ee"/>
    <circle cx="70" cy="122" r="1.5" fill="#0891b2"/>
    <circle cx="18" cy="70" r="1.5" fill="#34d399"/>
  </g>

  <!-- Coin (back layer) -->
  <g filter="url(#softGlow)">
    <circle cx="86" cy="92" r="26" fill="url(#coinGrad)" opacity="0.25"/>
    <circle cx="86" cy="92" r="22" fill="url(#coinInner)" stroke="url(#coinGrad)" stroke-width="1.5"/>
    <!-- Coin inner detail -->
    <circle cx="86" cy="92" r="14" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.4"/>
    <text x="86" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0a1820">K</text>
  </g>

  <!-- Lightning bolt (front layer) -->
  <g filter="url(#boltGlow)">
    <!-- Main bolt shape -->
    <path d="M 80 18 L 38 78 L 64 78 L 54 122 L 100 56 L 76 56 Z" fill="url(#boltGrad)"/>
    <!-- Highlight on bolt -->
    <path d="M 80 18 L 38 78 L 64 78 L 54 122 L 100 56 L 76 56 Z" fill="url(#boltHi)" opacity="0.6"/>
    <!-- Sharp edge highlight -->
    <path d="M 80 18 L 38 78 L 64 78 L 54 122 L 100 56 L 76 56 Z" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Sparkle dots around bolt -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="24" cy="40" r="1.2"/>
    <circle cx="118" cy="30" r="1.5"/>
    <circle cx="28" cy="104" r="1"/>
    <circle cx="106" cy="118" r="1.2"/>
  </g>

  <!-- Bottom shadow under bolt -->
  <ellipse cx="70" cy="128" rx="38" ry="3" fill="#34d399" opacity="0.08"/>
</svg>
